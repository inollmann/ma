[tool.poetry]
name = "masterarbeit"
version = "0.1.0"
description = ""
authors = ["inollmann <116682060+inollmann@users.noreply.github.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "~3.10"
mediapipe = "^0.10.14"
numpy = "^1.23.5"
tflite = "^2.10.0"
scikit-learn = "^1.5.1"
opencv-python = "^4.10.0.84"
pandas = "^2.2.2"
matplotlib = "^3.9.2"
requests = "^2.32.3"
seaborn = "^0.13.2"
tensorflow = {version = "^2.13.0" }
tensorflow-intel = { version = "^2.13.0", platform = "win32" }
tensorflow-cpu = [
    { version = "^2.13.0", platform = "linux", markers = "platform_machine!='arm64' and platform_machine!='aarch64'" },
    { version = "^2.13.0", platform = "darwin", markers = "platform_machine!='arm64' and platform_machine!='aarch64'" },]
tensorflow-io-gcs-filesystem = [
    { version = "< 0.32.0", markers = "platform_system == 'Windows'" }
]
gensim = "^4.3.3"
pybind11 = "^2.13.4"
fasttext-wheel = "^0.9.2"
fasttext = {path = "libs/fasttext"}
torch = { version = "2.3.0", source="torch"}
torchtext = "^0.18.0"
sacremoses = "^0.1.1"
compress-fasttext = {extras = ["full"], version = "^0.1.5"}
pysrt = "^1.1.2"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


[[tool.poetry.source]]
name = "torch"
url = "https://download.pytorch.org/whl/cu121"
secondary = true
